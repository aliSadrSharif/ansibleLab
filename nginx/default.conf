# Reference Nginx config for a REAL production domain with Let's Encrypt (via certbot.sh),
# as an alternative to the self-signed myapp.local setup used for local grading/testing
# (see 06_nginx/ and 07_ssl/ for that path). Replace YOUR_DOMAIN and run certbot.sh to
# obtain real certificates, then use this as /etc/nginx/sites-available/YOUR_DOMAIN.
server {
        listen 80;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;
        return 301 https://$host$request_uri;
}

server {
        listen 443 ssl;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;

        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;

        location / {
                proxy_pass http://127.0.0.1:3000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
                proxy_pass http://127.0.0.1:3001/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /mongo/ {
                proxy_pass http://127.0.0.1:8081;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
                root /usr/share/nginx/html;
        }
}
