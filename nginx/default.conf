# Nginx load-balancer config for the DaneshkarTeamProject stack.
#
# Host port mapping (docker-compose.yaml):
#   api-1 -> 127.0.0.1:3001
#   api-2 -> 127.0.0.1:3002
#   api-3 -> 127.0.0.1:3003
#
# Deploy on the host (system nginx):
#   sudo cp nginx/default.conf /etc/nginx/sites-available/myapp.local
#   sudo ln -sf /etc/nginx/sites-available/myapp.local /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream api_backend {
    least_conn;

    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

upstream web_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream mongo_express_backend {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name myapp.local;

    access_log /var/log/nginx/myapp.local.access.log;
    error_log  /var/log/nginx/myapp.local.error.log;

    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /mongo/ {
        proxy_pass http://mongo_express_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
