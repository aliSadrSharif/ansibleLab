# Reverse-proxy webserver for the DaneshkarTeamProject stack.
#
# Routes:
#   /        -> React frontend  (docker compose service: web, 127.0.0.1:3000)
#   /api/    -> Express API      (docker compose service: api, 127.0.0.1:3001)
#   /mongo/  -> Mongo Express UI (docker compose service: mongo-express, 127.0.0.1:8081)
#
# Deploy on the host (system nginx):
#   sudo cp nginx/webserver.conf /etc/nginx/sites-available/myapp.local
#   sudo ln -sf /etc/nginx/sites-available/myapp.local /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace myapp.local with your domain or keep it for local testing
# (add "127.0.0.1 myapp.local" to /etc/hosts).

server {
    listen 80;
    listen [::]:80;
    server_name myapp.local;

    access_log /var/log/nginx/myapp.local.access.log;
    error_log  /var/log/nginx/myapp.local.error.log;

    # Frontend — React SPA served by `serve`
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — strips /api/ prefix before forwarding
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mongo Express admin UI (protected by basic auth inside the container)
    location /mongo/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
