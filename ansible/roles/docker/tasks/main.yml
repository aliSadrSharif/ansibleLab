---
# Create /etc/apt/keyrings
#           ↓
# Download Docker GPG key
#           ↓
# Add Docker official APT repository
#           ↓
# Install Docker Engine + CLI + containerd
#           ↓
# Install Buildx + Docker Compose
#           ↓
# Start Docker
#           ↓
# Enable Docker at boot
#           ↓
# Add app_owner → docker group
#           ↓
# Install Python Docker SDK for Ansible
- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker CE and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ app_owner }}"
    groups: docker
    append: true

- name: Install Docker Python SDK for Ansible modules
  ansible.builtin.pip:
    name:
      - docker
    state: present
    break_system_packages: true
  failed_when: false
