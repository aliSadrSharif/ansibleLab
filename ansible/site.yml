---
# Main entry point: server prep -> app deploy -> Nginx/SSL -> evidence.
# Usage (from ansible/):
#   ansible-playbook site.yml --ask-become-pass

- import_playbook: server_setup.yml
- import_playbook: deploy_app.yml
- import_playbook: deploy_nginx.yml

- name: Collect deployment evidence
  hosts: webservers
  become: true
  roles:
    - evidence
