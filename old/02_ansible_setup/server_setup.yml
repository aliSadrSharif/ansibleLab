---
# Prepares the target host for the application deployment:
# system update, base tooling, UFW firewall, Docker Engine and Nginx.
- name: Prepare server for Docker + Nginx deployment
  hosts: webservers
  become: yes

  vars:
    base_packages:
      - curl
      - wget
      - git
      - vim
      - htop
      - ca-certificates
      - gnupg
      - lsb-release

  tasks:
    - name: Update apt package index
      apt:
        update_cache: yes
        cache_valid_time: 3600
      # This host has an unrelated third-party repo (Claude Desktop's apt source) that
      # intermittently returns 403/unsigned errors. apt-get still refreshes every other
      # (Ubuntu/Docker) repo successfully in that case, so we don't want one unrelated
      # broken source to fail the whole play.
      ignore_errors: yes

    - name: Install base packages
      apt:
        name: "{{ base_packages }}"
        state: present

    - name: Install UFW
      apt:
        name: ufw
        state: present

    - name: Allow SSH (22/tcp) through UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP (80/tcp) through UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS (443/tcp) through UFW
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW with default deny-incoming / allow-outgoing
      community.general.ufw:
        state: enabled
        policy: allow
        direction: outgoing

    - name: Set default incoming policy to deny
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Check whether the Docker apt repository is already configured
      stat:
        path: /etc/apt/sources.list.d/docker.list
      register: docker_repo_file

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: not docker_repo_file.stat.exists

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      when: not docker_repo_file.stat.exists

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add invoking user to the docker group
      user:
        name: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        groups: docker
        append: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx service
      systemd:
        name: nginx
        state: started
        enabled: yes
