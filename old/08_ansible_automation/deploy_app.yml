---
# Deploys the application (frontend, backend, database, mongo-express) to app_dir
# and brings it up with Docker Compose.
- name: Deploy application with Docker Compose
  hosts: webservers
  become: yes
  vars_files:
    - app_vars.yml

  tasks:
    - name: Ensure application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Verify a local .env file exists (required — holds DB credentials)
      stat:
        path: "{{ app_repo_root }}/.env"
      register: dotenv_file
      delegate_to: localhost

    - name: Fail early with a clear message if .env is missing
      assert:
        that: dotenv_file.stat.exists
        fail_msg: >-
          {{ app_repo_root }}/.env not found. Copy .env.example to .env and fill in
          real credentials before running this playbook.

    - name: Copy frontend source
      copy:
        src: "{{ app_repo_root }}/frontend/"
        dest: "{{ app_dir }}/frontend/"
        mode: preserve

    - name: Copy backend source
      copy:
        src: "{{ app_repo_root }}/backend/"
        dest: "{{ app_dir }}/backend/"
        mode: preserve

    - name: Copy docker-compose.yaml
      copy:
        src: "{{ app_repo_root }}/docker-compose.yaml"
        dest: "{{ app_dir }}/docker-compose.yaml"
        mode: "0644"

    - name: Copy .env (credentials)
      copy:
        src: "{{ app_repo_root }}/.env"
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Build Docker images
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        build: always
        state: present

    - name: Bring the stack up
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
      register: compose_result

    - name: Wait for the frontend to accept connections
      wait_for:
        host: 127.0.0.1
        port: 3000
        timeout: 60

    - name: Wait for the API to accept connections
      wait_for:
        host: 127.0.0.1
        port: 3001
        timeout: 60

    - name: Show container status
      command: docker compose -f {{ app_dir }}/docker-compose.yaml ps
      register: compose_status
      changed_when: false

    - name: Print container status
      debug:
        var: compose_status.stdout_lines
