---
# Configures system Nginx as a TLS-terminating reverse proxy for the application,
# using a self-signed certificate for app_domain.
- name: Configure Nginx reverse proxy with SSL
  hosts: webservers
  become: yes
  vars_files:
    - nginx_vars.yml

  tasks:
    - name: Create SSL directory
      file:
        path: "{{ ssl_dir }}"
        state: directory
        mode: "0755"

    - name: Generate private key
      community.crypto.openssl_privatekey:
        path: "{{ ssl_key_path }}"
        size: 2048
        mode: "0600"

    - name: Generate self-signed certificate request
      community.crypto.openssl_csr:
        path: "{{ ssl_dir }}/{{ app_domain }}.csr"
        privatekey_path: "{{ ssl_key_path }}"
        common_name: "{{ app_domain }}"
        country_name: IR
        state_or_province_name: Tehran
        locality_name: Tehran
        organization_name: AnsibleLab
        organizational_unit_name: DevOps

    - name: Generate self-signed certificate
      community.crypto.x509_certificate:
        path: "{{ ssl_cert_path }}"
        privatekey_path: "{{ ssl_key_path }}"
        csr_path: "{{ ssl_dir }}/{{ app_domain }}.csr"
        provider: selfsigned
        selfsigned_not_after: "+365d"
        mode: "0644"

    - name: Deploy Nginx site configuration from template
      template:
        src: templates/nginx.conf.j2
        dest: "/etc/nginx/sites-available/{{ app_domain }}"
        mode: "0644"
      notify: Reload nginx

    - name: Enable the site (symlink into sites-enabled)
      file:
        src: "/etc/nginx/sites-available/{{ app_domain }}"
        dest: "/etc/nginx/sites-enabled/{{ app_domain }}"
        state: link
      notify: Reload nginx

    - name: Disable the default site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Test full Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Add domain to /etc/hosts for local resolution
      lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 {{ app_domain }}"
        regexp: "^127\\.0\\.0\\.1\\s+{{ app_domain }}$"
        state: present

  handlers:
    - name: Reload nginx
      systemd:
        name: nginx
        state: reloaded
