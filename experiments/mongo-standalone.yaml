# Standalone MongoDB + Mongo Express scratch/experiment file.
#
# NOT part of the deployed application stack — that lives in the root
# `docker-compose.yaml` (services: web, api, db, mongoExpress, nginx).
#
# This was an earlier, independent setup used to poke at Mongo directly.
# Do NOT run it alongside the root docker-compose.yaml: both define a
# Mongo instance bound to host port 27017 and will conflict.
services:
  mongodb1:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass123

  mongoexpress1:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass123
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=pass123
      - ME_CONFIG_MONGODB_SERVER=mongodb1
